name: Kissat byte return

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kissat-byte-return.yml

permissions:
  contents: read

jobs:
  return-exact-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and reverify exact Zenodo object
        shell: bash
        run: |
          set -euo pipefail
          out='arminbiere-kissat-rel-4.0.4.zip'
          curl --fail --location \
            --retry 12 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 600 \
            --output "$out" \
            'https://zenodo.org/records/17371510/files/arminbiere/kissat-rel-4.0.4.zip?download=1'
          test "$(stat -c %s "$out")" = '719333'
          test "$(md5sum "$out" | awk '{print $1}')" = 'd165b5c4514334e853e8313437447393'
          test "$(sha256sum "$out" | awk '{print $1}')" = '332deb4b4fb4373d90e6870c07d68c4a03d9ee1240d684bec34f3570f322a35c'
          unzip -t "$out" >/dev/null
          md5sum "$out" > MD5SUMS
          sha256sum "$out" > SHA256SUMS

      - name: Return exact original ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kissat-zenodo-original-public-transfer
          path: |
            arminbiere-kissat-rel-4.0.4.zip
            MD5SUMS
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
